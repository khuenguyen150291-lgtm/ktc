<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KTC – Quản lý</title>
<meta name="theme-color" content="#1f2329">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--nen:#f3f4f6;--the:#fff;--chu:#1a1d21;--phu:#667085;--vien:#e4e7ec;--toi:#1f2329;--toi2:#2a2f37;--vang:#f6c700;--vangnhat:#fff7d1;--do:#e31e24;--xanh:#12805c;--xanhnhat:#e7f6ef;--donhat:#fdecec;--camnhat:#fff4e5;--cam:#b54708;--bong:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
*{box-sizing:border-box}html,body{margin:0;background:var(--nen);color:var(--chu);font:14.5px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}button,input,select,textarea{font:inherit}
.so,td.r,.r{font-variant-numeric:tabular-nums}
svg.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* khung */
#ben{position:fixed;inset:0 auto 0 0;width:240px;background:var(--toi);color:#d0d5dd;display:flex;flex-direction:column;z-index:6}
#ben .thuong{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
#ben .thuong img{width:38px;height:38px;border-radius:8px;background:#fff;padding:3px}
#ben .thuong b{color:#fff;font-size:15px;line-height:1.2}#ben .thuong small{display:block;color:#98a2b3;font-size:11.5px;font-weight:400}
#menu{flex:1;overflow:auto;padding:6px 10px}
#menu .nhom{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#7d8696;padding:14px 12px 6px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f2f4f7;color:#344054}
.thanh{height:8px;border-radius:99px;background:#eef0f3;overflow:hidden}.thanh i{display:block;height:100%;background:var(--vang)}
.chiso{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.doitac .dong{cursor:default}
#menu a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;text-decoration:none;color:#d0d5dd;font-weight:500;margin-bottom:2px}
#menu a:hover{background:var(--toi2);color:#fff}
#menu a.on{background:var(--vang);color:var(--toi)}
#ben .nguoi{display:flex;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid #343a44}
#ben .nguoi .ten{color:#fff;font-weight:600;font-size:13.5px;line-height:1.2}#ben .nguoi small{color:#98a2b3;font-size:12px}
.av{width:34px;height:34px;border-radius:50%;background:var(--vang);color:var(--toi);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
#dau{display:none}
main{margin-left:240px;padding:26px 32px 48px;max-width:1320px}
.tieude{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.tieude h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.2px}.tieude p{margin:2px 0 0;color:var(--phu);font-size:13px}
#duoi{display:none}
/* thành phần */
.the{background:var(--the);border:1px solid var(--vien);border-radius:12px;box-shadow:var(--bong);padding:18px;margin-bottom:16px}
.the h3{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.luoi{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.kpi{background:var(--the);border:1px solid var(--vien);border-radius:12px;box-shadow:var(--bong);padding:16px 18px;position:relative;overflow:hidden;text-decoration:none;display:block}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--vang)}
.kpi .nhan{color:var(--phu);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .so{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.3px}.kpi .them{font-size:12px;color:var(--phu);margin-top:2px}
.kpi.xanh:before{background:var(--xanh)}.kpi.do:before{background:var(--do)}.kpi.toi:before{background:var(--toi)}
.hai{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.bang{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.bang th{background:#f9fafb;color:var(--phu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.3px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--vien);position:sticky;top:0}
.bang td{padding:10px 12px;border-bottom:1px solid #f0f2f5;vertical-align:top}
.bang tr:hover td{background:#fcfcfd}.bang td.r,.bang th.r{text-align:right;white-space:nowrap}
.cuon{overflow:auto;max-height:70vh;border:1px solid var(--vien);border-radius:10px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.t-xong{background:var(--xanhnhat);color:var(--xanh)}.t-dang{background:var(--camnhat);color:var(--cam)}.t-huy{background:var(--donhat);color:#b42318}.t-xam{background:#f2f4f7;color:#475467}
.dong{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid #f0f2f5;cursor:pointer}.dong:last-child{border:0}
.dong:hover{background:#fcfcfd}.dong .chinh{min-width:0}.dong .chinh b{font-weight:600}.nho{font-size:12.5px;color:var(--phu)}
.ma{font-size:11.5px;color:var(--phu);font-weight:600;letter-spacing:.2px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;color:var(--chu);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--vang);box-shadow:0 0 0 3px rgba(246,199,0,.25)}
label{display:block;font-size:12.5px;color:var(--phu);font-weight:500;margin:10px 0 4px}
.nut{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:9px 16px;background:var(--toi);color:#fff;font-weight:600;cursor:pointer}
.nut.vang{background:var(--vang);color:var(--toi)}.nut.phu{background:#fff;color:var(--chu);border:1px solid #d0d5dd}.nut:disabled{opacity:.5}
.hang{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.hang>*{flex:1;min-width:140px}.hang>.nut,.hang>.tab,.hang>.tag{flex:none;min-width:0}.tab button{white-space:nowrap}
.canh{display:flex;gap:10px;background:var(--camnhat);color:#7a2e0e;border:1px solid #fedf89;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.rong{color:var(--phu);text-align:center;padding:24px 8px}
.bieu{width:100%;height:auto}.bieu text{font-size:11px;fill:var(--phu)}
.chu-giai{display:flex;gap:14px;font-size:12.5px;color:var(--phu)}.chu-giai i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tab{display:inline-flex;background:#f2f4f7;border-radius:9px;padding:3px;gap:2px}.tab button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--phu);cursor:pointer}.tab button.on{background:#fff;color:var(--chu);box-shadow:var(--bong)}
#dangnhap{max-width:420px;margin:12vh auto;text-align:center}
#dangnhap img{width:96px;height:96px}
#thongbao{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--toi);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.an{display:none!important}
.av{position:relative;overflow:hidden}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.aithay{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--phu)}.aithay .chong{display:flex}.aithay .av{width:26px;height:26px;font-size:10.5px;border:2px solid #fff;margin-left:-7px}.aithay .chong .av:first-child{margin-left:0}.aithay .av.sua{box-shadow:0 0 0 2px var(--vang)}
/* điện thoại */
@media (max-width:900px){
  #ben{display:none}
  #dau{display:flex;position:sticky;top:0;z-index:5;align-items:center;gap:10px;background:var(--toi);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  #dau img{width:32px;height:32px;border-radius:7px;background:#fff;padding:2px}#dau b{flex:1;font-size:15px}
  main{margin:0;padding:16px 16px calc(84px + env(safe-area-inset-bottom))}
  .luoi{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:13px 14px}.kpi .so{font-size:19px}
  .hai{grid-template-columns:1fr}
  .tieude h1{font-size:19px}
  #duoi{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--vien);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  #duoi a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--phu);text-decoration:none;font-weight:600;padding:4px 0;border-radius:8px}
  #duoi a.on{color:var(--toi)}#duoi a.on svg{color:var(--do)}
  .bang.co-the thead{display:none}.bang.co-the tr{display:block;border-bottom:1px solid var(--vien);padding:8px 4px}.bang.co-the td{display:flex;justify-content:space-between;gap:10px;border:0;padding:3px 8px}
  .bang.co-the td:before{content:attr(data-n);color:var(--phu);font-size:12px;flex:none}.bang.co-the td{text-align:right}.bang.co-the td:empty{display:none}
  .cuon{max-height:none;border:0}
}
#sheet{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:15;display:none;align-items:flex-end}
#sheet>div{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
#sheet a{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600}
/* đợt 3: công việc */
#luu{position:fixed;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:21;display:none;pointer-events:none;background:#fff;color:var(--phu);border:1px solid var(--vien);border-radius:999px;padding:3px 12px;font-size:12px;white-space:nowrap;box-shadow:0 2px 10px rgba(16,24,40,.12)}
#luu.xong{color:var(--xanh)}
#nutAI{position:fixed;right:18px;bottom:22px;z-index:13;width:52px;height:52px;border-radius:50%;border:0;background:var(--toi);color:var(--vang);font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(16,24,40,.28);cursor:pointer}
@media (max-width:900px){#nutAI{right:12px;bottom:calc(74px + env(safe-area-inset-bottom));width:46px;height:46px}}
.ai-toi{margin:8px 0 2px;font-weight:600}.ai-ai{white-space:pre-wrap;background:#f6f7f9;border-radius:10px;padding:10px 12px;margin:4px 0 10px}.ai-loi{color:#b42318;margin:4px 0 10px}.ai-cho{color:var(--phu);margin:4px 0 10px}
#tien{position:fixed;top:0;left:0;right:0;height:3px;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--vang),transparent) no-repeat;background-size:40% 100%;animation:chay 1.1s linear infinite}
@keyframes chay{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#tien{animation:none;background:var(--vang)}}
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;align-items:start}
.kb .cot{background:#e9ebef;border-radius:12px;padding:10px;min-height:140px;scroll-snap-align:start}
.kb .cot.tha{outline:2px dashed var(--toi);outline-offset:-2px}
.kb h4{margin:2px 4px 10px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;color:#344054}
.vc{background:#fff;border:1px solid var(--vien);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--bong)}
.vc:hover{border-color:#c5cad3}.vc.tre{border-left:3px solid var(--do)}
.vc b{font-weight:600;display:block;line-height:1.35}
.vc .duoi{display:flex;justify-content:space-between;align-items:center;gap:6px 8px;margin-top:8px;flex-wrap:wrap}.vc .duoi .nho{white-space:nowrap}
.t-vang{background:var(--vangnhat);color:#7a5a00}
.moc{display:flex;gap:3px;margin:8px 0}.moc i{flex:1;height:8px;border-radius:99px;background:#e4e7ec}.moc i.x{background:var(--xanh)}.moc i.d{background:var(--vang)}.moc i.t{background:var(--do)}.moc i.q{background:repeating-linear-gradient(135deg,#d5d9e0 0 3px,#fff 3px 6px)}
.sott{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#eef0f3;color:#475467;flex:none}
.sott.x{background:var(--xanh);color:#fff}.sott.d{background:var(--vang);color:var(--toi)}.sott.t{background:var(--do);color:#fff}.sott.q{background:#fff;border:1px dashed #98a2b3;color:#98a2b3}
#hop{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:14;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 12px}
#hop>div{background:#fff;border-radius:14px;width:min(700px,100%);padding:18px 20px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#hop h2{margin:0 0 10px;font-size:18px}
.ck{display:flex;gap:9px;align-items:flex-start;padding:5px 0;margin:0;color:var(--chu);font-size:14px;font-weight:400}.ck input{width:auto;margin-top:3px;flex:none}.ck.x span{text-decoration:line-through;color:var(--phu)}
.nhom-viec{margin:18px 2px 8px;font-size:13px;font-weight:600;color:#344054;display:flex;gap:8px;align-items:center}
.luoi-viec{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}.luoi-viec .vc{margin:0}
.kn{border-radius:12px;padding:16px 18px;margin-bottom:16px;border:1px solid}
.kn.m0{background:var(--xanhnhat);border-color:#a6dcc5}.kn.m1{background:var(--camnhat);border-color:#fedf89}.kn.m2{background:var(--donhat);border-color:#f5b5b1}
.kn h3{margin:0 0 6px;font-size:16px}.kn ul{margin:6px 0 0;padding-left:20px}
a.canh{text-decoration:none}
@media (max-width:900px){
  #hop{padding:0;align-items:flex-end}#hop>div{border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .kb{grid-auto-columns:82%}
  .hai>div{display:contents}.hai .uu{order:-1}.hai .cuoi{order:1}
}
</style>
</head>
<body>
<aside id="ben" class="an">
  <div class="thuong"><img src="logo.png" alt="KTC"><div><b>Kiến Thành Công</b><small>Hệ thống quản lý</small></div></div>
  <nav id="menu"></nav>
  <div class="nguoi"><div class="av" id="avNguoi"></div><div><div class="ten" id="tenNguoi"></div><small id="chucNguoi"></small></div></div>
</aside>
<header id="dau" class="an"><img src="logo.png" alt="KTC"><b>Kiến Thành Công</b><div class="av" id="avNguoi2"></div></header>
<main id="noidung">
  <div id="dangnhap" class="the">
    <img src="logo.png" alt="Kiến Thành Công">
    <h2 style="margin:10px 0 4px">Kiến Thành Công</h2>
    <p class="nho">Hệ thống quản lý nội bộ. Chỉ Gmail đã được cấp quyền mới vào được.</p>
    <div id="nutGoogle" style="display:flex;justify-content:center;margin:18px 0 6px"></div>
    <p class="nho" id="loiDN" style="color:#b42318"></p>
  </div>
</main>
<nav id="duoi" class="an"></nav>
<div id="sheet" onclick="if(event.target===this)this.style.display='none'"><div id="sheetND"></div></div>
<div id="hop" onclick="if(event.target===this)dongHop()"><div id="hopND"></div></div>
<div id="tien"></div>
<div id="thongbao"></div>
<div id="luu" role="status" aria-live="polite"></div>
<button id="nutAI" class="an" onclick="moAI()" aria-label="Hỏi trợ lý AI" title="Hỏi trợ lý AI">AI</button>
<script>
'use strict';
const API_URL = 'https://script.google.com/macros/s/AKfycbwlkymttq8kohsqy_tMOh1BSHdj6w3h_szFXAKx1d52MsMeB3PG1IFwFgwl1bOVad41MQ/exec';
const CLIENT_ID = '419003041557-9t0fo8dapliq3fn64a7t1g7tv5efm5ap.apps.googleusercontent.com';
let TOKEN = null, ME = null, CACHE = {};
const $ = s => document.querySelector(s);
const vnd = n => (Math.round(+n || 0)).toLocaleString('vi-VN');
const trieu = n => { n = +n || 0; const a = Math.abs(n); return a >= 1e9 ? (n / 1e9).toLocaleString('vi-VN', { maximumFractionDigits: 2 }) + ' tỷ' : a >= 1e6 ? (n / 1e6).toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + ' tr' : vnd(n); };
const ngay = s => s ? s.split('-').reverse().join('/') : '';
const isoNgay = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const homNay = () => isoNgay(new Date());                      // ngày theo giờ máy, không dùng giờ quốc tế (lệch trước 7 giờ sáng)
const congNgay = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoNgay(d); };
const cachNgay = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5);
const ngayNgan = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const lucNgan = s => String(s || '').slice(5, 16).replace(/^(\d\d)-(\d\d)/, '$2/$1');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tat = ten => { const w = String(ten || '?').trim().split(/\s+/); return (w[w.length - 1][0] || '?').toUpperCase(); };
function bao(t, ms) { const e = $('#thongbao'); e.textContent = t; e.style.display = 'block'; clearTimeout(bao.t); bao.t = setTimeout(() => e.style.display = 'none', ms || 3000); }
function tag(tt) { const c = tt === 'Đã xong' ? 't-xong' : tt === 'Hủy' ? 't-huy' : 't-dang'; return `<span class="tag ${c}">${esc(tt || '')}</span>`; }

/* ---------- biểu tượng ---------- */
const IC = {
  nha: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  ct: '<path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-5h6v5"/><path d="M9 11h.01M15 11h.01"/>',
  tc: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M16 15h2"/>',
  no: '<path d="M7 4h10l3 4v12H4V8z"/><path d="M8 13h8M8 17h5"/>',
  vp: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h3"/>',
  duyet: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',

  let s = `<svg class="bieu" viewBox="0 0 ${W} ${H}" role="img" aria-label="Thu chi theo tháng năm ${nam}">`;
  for (let i = 0; i <= 4; i++) { const y = 10 + (H - b - 10) * i / 4, v = dinh * (1 - i / 4); s += `<line x1="${l}" x2="${W - 4}" y1="${y}" y2="${y}" stroke="#eef0f3"/><text x="${l - 6}" y="${y + 4}" text-anchor="end">${trieu(v).replace(' tr', '')}</text>`; }
  T.forEach((x, i) => {
    const cx = l + cw * i + cw / 2, hTh = (H - b - 10) * x.thu / dinh, hCh = (H - b - 10) * x.chi / dinh;
    s += `<rect x="${cx - bw - 1}" y="${H - b - hTh}" width="${bw}" height="${hTh}" rx="3" fill="#f6c700"><title>Tháng ${x.t} – thu ${vnd(x.thu)}</title></rect>`;
    s += `<rect x="${cx + 1}" y="${H - b - hCh}" width="${bw}" height="${hCh}" rx="3" fill="#1f2329"><title>Tháng ${x.t} – chi ${vnd(x.chi)}</title></rect>`;
    s += `<text x="${cx}" y="${H - 6}" text-anchor="middle">T${x.t}</text>`;
  });
  return s + '</svg>';
}

function themTD(ma) {

  moHop(dauHop('Hỏi trợ lý AI') + `<p class="nho" style="margin:-4px 0 8px">${co ? 'AI trả lời theo số liệu anh/chị được xem trong app. AI có thể sai: việc quan trọng thì mở mục gốc kiểm lại. Câu hỏi và câu trả lời được lưu lại để chỉnh app cho sát việc.' : (ad ? 'Trợ lý trong app đang <b>tắt</b> (chưa cài khóa, không tốn tín dụng). Anh gõ câu hỏi rồi bấm <b>Mở Claude</b>: câu hỏi được điền sẵn trong ứng dụng Claude của anh và tính vào gói Claude anh đang dùng.' : '<b style="color:#b42318">Trợ lý AI chưa được bật, báo anh Khuê.</b>')}</p>
    ${khoa}<div id="aiND"></div>
    <div class="hang" style="align-items:flex-end"><textarea id="aiHoi" rows="2" style="flex:3" placeholder="Gõ câu hỏi…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();guiAI()}"></textarea><button class="nut" id="aiGui" style="flex:none" onclick="guiAI()">${co ? 'Hỏi' : 'Mở Claude'}</button></div>
    ${!co && ad ? '<p style="margin:8px 0 0"><a id="aiWeb" class="nho" href="https://claude.ai/new" target="_blank" rel="noopener">Không thấy Claude mở ra? Bấm đây để mở bằng trình duyệt</a></p>' : ''}
    ${AI_LS.length ? '<p style="margin:8px 0 0"><a class="nho" href="javascript:void 0" onclick="AI_LS=[];veAI()">Xóa cuộc trò chuyện này</a></p>' : ''}`);

}
/* Mở đường dẫn ra ngoài app: đường https mở thẻ mới, đường của ứng dụng (zalo://, claude://) giao cho máy mở ứng dụng */
let MO_NGOAI = '';
function moNgoai(u) { MO_NGOAI = u; if (/^https?:/i.test(u)) window.open(u, '_blank', 'noopener'); else location.href = u; }
const laDT = () => /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let AI_HIEN = false;      // anh Khuê chốt 23/11/2026 18:17: tắt nút AI với MỌI người, kể cả quản trị. Muốn bật lại thì đổi thành true.
function hienNutAI() { const e = $('#nutAI'); if (e) e.classList.toggle('an', !AI_HIEN || !(ME && (ME.ai !== false || ME.vai === 'admin'))); }
/* Link nhóm Zalo: mở thẳng ứng dụng Zalo bằng zalo://zalo.me/g/…, đúng đường trang zalo.me tự dùng khi bấm "Tham gia nhóm". Link dạng khác thì mở trang web như cũ. */
function moZalo(ev, link) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  const m = /^https?:\/\/(zalo\.me\/g\/[A-Za-z0-9_-]+)\/?$/i.exec(String(link || '').trim());
  if (!m) { moNgoai(link); return; }
  let roi = false; const an = () => { if (document.hidden) roi = true; }, mo = () => { roi = true; };
  document.addEventListener('visibilitychange', an); window.addEventListener('blur', mo);
  moNgoai('zalo://' + m[1]);
  setTimeout(() => {
    document.removeEventListener('visibilitychange', an); window.removeEventListener('blur', mo);
    if (roi) return;
    if (laDT()) window.open(link, '_blank', 'noopener');                    // điện thoại không có đường zalo:// thì mở trang web của nhóm
    else bao('Nếu Zalo không tự mở: bấm "mở trang web" ở khung Nhóm Zalo trong trang công trình.', 6000);
  }, 2500);
}
/* Chưa cài khóa: quản trị hỏi trong ứng dụng Claude của chính mình (tính vào gói Claude, không dùng khóa API, không qua máy xử lý) */
function hoiClaude() {
  const o = $('#aiHoi'), t = o ? o.value.trim() : ''; if (!t) { bao('Gõ câu hỏi trước đã'); return; }
  const ct = /^#\/ct\?/.test(location.hash) && CACHE.ctDang ? `\nĐang xem công trình: ${CACHE.ctDang.ma} ${CACHE.ctDang.ten}.` : '';
  const loi = `Câu hỏi từ app quản lý KTC. Dùng số liệu của app: Google Sheet "KTC_APP_DuLieu" trên Drive (bảng CongTrinh, Viec, MocCT, PhanCong, TienDo) và tài liệu dự án "Quản Lý Kiến Thành Công". Trả lời ngắn gọn, ghi rõ lấy từ bảng nào.${ct}\n\nCâu hỏi: ${t}`.slice(0, 6000);
  try { navigator.clipboard.writeText(loi).catch(() => {}); } catch (e) {}
  const q = encodeURIComponent(loi), w = $('#aiWeb'); if (w) w.href = 'https://claude.ai/new?q=' + q;
  o.value = '';
  AI_LS.push({ vai: 'toi', noi_dung: t }, { vai: 'ai', noi_dung: 'Đã chuyển câu hỏi sang ứng dụng Claude. Bên đó bấm gửi là xong. Nếu ô soạn tin trống thì dán vào (câu hỏi đã được sao chép).' }); veAI();
  moNgoai((laDT() ? 'https://claude.ai/new?q=' : 'claude://claude.ai/new?q=') + q);
}
async function guiAI() {
  if (ME.ai === false && ME.vai === 'admin') return hoiClaude();
  const o = $('#aiHoi'), t = o ? o.value.trim() : ''; if (!t || AI_LS.some(m => m.vai === 'cho')) return;
  o.value = '';
  const lichSu = AI_LS.filter(m => m.vai === 'toi' || m.vai === 'ai').slice(-6).map(m => ({ vai: m.vai, noi_dung: m.noi_dung }));
  AI_LS.push({ vai: 'toi', noi_dung: t }, { vai: 'cho', noi_dung: 'Đang trả lời…' }); veAI();
  let kq;
  try { const r = await goi('hoiAI', { cau_hoi: t, lich_su: lichSu }); kq = { vai: 'ai', noi_dung: r.tra_loi }; ME.ai = true; }
  catch (e) { kq = { vai: 'loi', noi_dung: e.message }; }
  AI_LS = AI_LS.filter(m => m.vai !== 'cho'); AI_LS.push(kq); veAI();
  const o2 = $('#aiHoi'); if (o2) o2.focus();

async function luuKhoaAI(xoa) {

  if (xoa && !confirm('Tắt trợ lý AI và xóa khóa đang lưu ở máy xử lý?')) return;
  const n = $('#aiKhoaL'); if (n) n.disabled = true;
  bao(xoa ? 'Đang tắt…' : 'Đang lưu khóa…', 30000);
  try {
    const r = await goi('datKhoaAI', xoa ? { xoa: true } : { khoa: k });
    if (o) o.value = '';
    ME.ai = r.ai; ME.ai_hang = r.hang; hienNutAI();
    try { localStorage.removeItem(khoaLuu('me')); } catch (e) {}
    bao(xoa ? 'Đã tắt trợ lý AI, khóa đã xóa.' : 'Đã lưu khóa ' + (r.hang === 'claude' ? 'Claude' : 'Gemini') + '. Hỏi thử một câu để kiểm.', 6000);
    moAI();

}

/* =================== ĐỢT 3: CÔNG VIỆC THEO CÔNG TRÌNH =================== */
const TT_MAU = { 'Chưa làm': 't-xam', 'Đang làm': 't-dang', 'Chờ kiểm tra': 't-vang', 'Xong': 't-xong', 'Tạm dừng': 't-xam' };
const ttTag = tt => `<span class="tag ${TT_MAU[tt] || 't-xam'}">${esc(tt)}</span>`;
const tenNgan = t => String(t || '').trim().split(/\s+/).slice(-2).join(' ');
function hanTag(v) {
  if (!v.han) return '';
  const hn = homNay();
  if (v.tt === 'Xong') return `<span class="tag t-xam">hạn ${ngayNgan(v.han)}</span>`;
  if (v.tt !== 'Tạm dừng' && v.han < hn) return `<span class="tag t-huy">trễ ${cachNgay(v.han, hn)} ngày</span>`;
  return `<span class="tag ${v.han <= congNgay(2) ? 't-dang' : 't-xam'}">${v.han === hn ? 'hôm nay' : 'hạn ' + ngayNgan(v.han)}</span>`;
}
function theViec(v, keo) {
  return `<div class="vc${v.tre ? ' tre' : ''}"${keo ? ` draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${v.ma}')"` : ''} onclick="moViec('${v.ma}')">
    <b>${v.uu_tien === 'Gấp' ? '<span class="tag t-huy" style="margin-right:6px">Gấp</span>' : ''}${esc(v.ten)}</b>
    ${v.ten_ct ? `<div class="nho">${esc(v.ten_ct)}${v.moc ? ' · ' + esc(v.moc) : ''}</div>` : ''}
    <div class="duoi"><span style="display:flex;gap:6px;align-items:center;min-width:0">${v.ma_nguoi ? av({ ten: v.nguoi, anh: v.anh }, 'width:24px;height:24px;font-size:10px') : ''}<span class="nho">${esc(tenNgan(v.nguoi) || 'Chưa giao ai')}</span></span>
    <span style="display:flex;gap:6px;align-items:center;flex:none">${v.cl_n ? `<span class="nho">${v.cl_x}/${v.cl_n} bước</span>` : ''}${keo ? '' : ttTag(v.tt)}${hanTag(v)}</span></div></div>`;
}
const dongViec = v => `<div class="dong" onclick="moViec('${v.ma}')"><div class="chinh"><b>${esc(v.ten)}</b><div class="nho">${esc(tenNgan(v.nguoi) || 'Chưa giao ai')}${v.moc ? ' · ' + esc(v.moc) : ''}${v.cl_n ? ' · ' + v.cl_x + '/' + v.cl_n + ' bước' : ''}</div></div><span style="display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end">${ttTag(v.tt)}${hanTag(v)}</span></div>`;

/* ---------- hộp nổi ---------- */
let HOPV = null, HOP_VIEC = false;                             // HOP_VIEC: hộp đang hiện chi tiết việc (không phải ô sửa, ô mốc…)
function moHop(h) { HOP_VIEC = false; $('#hopND').innerHTML = h; $('#hop').style.display = 'flex'; document.body.style.overflow = 'hidden'; }
function dongHop() { $('#hop').style.display = 'none'; document.body.style.overflow = ''; HOPV = null; HOP_VIEC = false; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#hop').style.display === 'flex') dongHop(); });
const dauHop = t => `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><h2>${t}</h2><button class="nut phu" style="padding:6px 10px" onclick="dongHop()" aria-label="Đóng">✕</button></div>`;
async function duLieuViec() { return CACHE.viec || (CACHE.viec = await goi('viec')); }
/* ghi + tải lại trang (và hộp việc đang mở) trong cùng một lượt gọi máy xử lý */
const DANG_GHI = new Set();
function nutBam() { const e = window.event, t = e && e.target && e.target.closest ? e.target.closest('button') : null; return t && document.contains(t) ? t : null; }
async function ghiRoiTai(action, payload, maViec, loiNhan) {
  const khoa = action + JSON.stringify(payload || {});
  if (DANG_GHI.has(khoa)) throw Object.assign(new Error('Đang lưu…'), { code: 'HUY' });   // bấm hai lần liền: chỉ lưu một lần
  DANG_GHI.add(khoa);
  const nut = nutBam();
  if (nut) { nut.disabled = true; nut.style.opacity = .55; }
  bao('Đang lưu…', 30000);
  KEM_GHI = true;                                               // các lượt đọc phát ra ngay sau đây đi kèm thao tác ghi này: lưu hỏng thì hủy, giữ nguyên màn hình
  const pGhi = goi(action, payload);
  const pCT = maViec ? goi('viecChiTiet', { ma: maViec }, true) : null;
  if (pCT) pCT.catch(() => {});
  CACHE.viec = null;
  const pTrang = dinhTuyen(true);
  KEM_GHI = false;
  let kq, loi = null;
  try { kq = await pGhi; if (loiNhan !== null) bao(loiNhan || 'Đã lưu', loiNhan ? 3000 : 1500); } catch (e) { loi = e; bao(e.message, 6000); }
  DANG_GHI.delete(khoa);
  if (nut) { nut.disabled = false; nut.style.opacity = ''; }
  if (pCT) { try { const v = await pCT; if (HOP_VIEC && HOPV && HOPV.ma === maViec) { HOPV = v; veHopGiu(); } } catch (e) {} }
  await pTrang;
  if (loi) throw loi;
  return kq;
}
/* Lưu rồi vẽ lại trang trong MỘT lượt gọi máy xử lý (trước đây là hai lượt nối nhau). xong = câu báo; null = nơi gọi tự báo. */
async function ghi(action, payload, xong) {
  try { return await ghiRoiTai(action, payload, '', xong); }
  catch (e) { throw Object.assign(e, { code: 'HUY' }); }      // lỗi đã báo ở ghiRoiTai, không báo lần hai
}

/* =================== HIỆN TRƯỚC, LƯU SAU (0.5.8) ===================
   Thao tác hay dùng (trạng thái việc, các bước, trao đổi, mốc, ghi chú tiến độ): màn hình đổi ngay khi bấm, việc lưu chạy ở nền.
   Lưu hỏng: trả màn hình về như trước khi bấm, báo rõ lý do, rồi lấy lại số liệu thật từ máy xử lý.
   Lưu xong: lấy số liệu thật về đối chiếu và vẽ lại (giữ chữ đang gõ dở, vị trí cuộn, mục đang mở). */
const NEN = { cho: 0, dot: 0, loi: null, hoan: [] };            // cho: số thao tác đang lưu; hoan: các hàm trả lại màn hình, theo thứ tự bấm
let KEO = 0;                                                   // đang kéo thẻ việc: chưa vẽ lại vội
document.addEventListener('dragstart', () => { KEO = Date.now(); });
['dragend', 'drop'].forEach(t => document.addEventListener(t, () => { KEO = 0; }));
window.addEventListener('beforeunload', e => { if (NEN.cho) { e.preventDefault(); e.returnValue = ''; } });     // đang lưu mà đóng trang thì trình duyệt hỏi lại
const gioMay = () => { const d = new Date(); return isoNgay(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const khoaLuu = (action, payload) => 'ktc:' + EMAIL + ':' + action + ':' + JSON.stringify(payload || {});
function chipLuu(tat) {
  const e = $('#luu'); if (!e) return;
  clearTimeout(chipLuu.t);
  if (tat) { e.style.display = 'none'; return; }
  e.textContent = NEN.cho ? 'Đang lưu…' : 'Đã lưu'; e.className = NEN.cho ? '' : 'xong'; e.style.display = 'block';
  if (!NEN.cho) chipLuu.t = setTimeout(() => { e.style.display = 'none'; }, 1300);
}
/* giữ chữ đang gõ dở, ô đang đứng, mục đang mở khi vẽ lại một vùng */
function chupO(goc) {
  const a = document.activeElement; let f = null;
  if (a && a.id && goc.contains(a)) { f = [a.id, null, null]; try { f[1] = a.selectionStart; f[2] = a.selectionEnd; } catch (e) {} }
  return { f,
    v: [...goc.querySelectorAll('input[id],textarea[id],select[id]')].filter(e => e.type !== 'checkbox' && e.type !== 'radio' && e.type !== 'file' && (e.tagName === 'SELECT' ? [...e.options].some(o => o.selected !== o.defaultSelected) : e.value !== e.defaultValue)).map(e => [e.id, e.value]),
    d: [...goc.querySelectorAll('details')].map(e => e.open) };
}
function traO(goc, g) {
  g.v.forEach(([id, v]) => { const e = document.getElementById(id); if (e && goc.contains(e)) e.value = v; });
  const ds = goc.querySelectorAll('details'); if (ds.length === g.d.length) ds.forEach((e, i) => { e.open = g.d[i]; });
  if (g.f) { const e = document.getElementById(g.f[0]); if (e && goc.contains(e)) { try { e.focus({ preventScroll: true }); if (g.f[1] != null) e.setSelectionRange(g.f[1], g.f[2]); } catch (x) {} } }
}
function thayThe(id, html) { const e = document.getElementById(id); if (!e) return; const g = chupO(e); e.outerHTML = html; const m = document.getElementById(id); if (m) traO(m, g); }
function veHopGiu() {
  if (!HOP_VIEC || !HOPV) return;
  const k = $('#hopND'), g = chupO(k), a = $('#hop').scrollTop, b = k.scrollTop;
  veHopViec(); traO(k, g); $('#hop').scrollTop = a; k.scrollTop = b;
}
/* ghi bản vừa sửa trên máy vào chỗ lưu sẵn, để chuyển trang trong lúc đang lưu vẫn thấy cái vừa bấm */
function luuMay() {
  if (!EMAIL) return;
  if (CACHE.viec && $('#vND')) luuGhi(khoaLuu('viec'), CACHE.viec);
  if (CACHE.ctDang && ($('#theMoc') || $('#theTD'))) luuGhi(khoaLuu('ctChiTiet', { ma: CACHE.ctDang.ma }), CACHE.ctDang);
  if (HOP_VIEC && HOPV) luuGhi(khoaLuu('viecChiTiet', { ma: HOPV.ma }), HOPV);
}
/* vẽ lại những chỗ đang hiện việc, từ số liệu trên máy */
function veViecMay() {
  veHopGiu();
  if ($('#vND')) veViec();
  if (CACHE.ctDang && $('#theViecCT')) thayThe('theViecCT', theViecCT(CACHE.ctDang));
  luuMay();
}
const viecMay = ma => [HOPV && HOPV.ma === ma ? HOPV : null, CACHE.viec && CACHE.viec.viec.find(v => v.ma === ma), CACHE.ctDang && (CACHE.ctDang.viec || []).find(v => v.ma === ma)].filter(Boolean);
/* sửa ngay một việc ở mọi chỗ đang giữ nó trên máy (hộp việc, danh sách việc, trang công trình) rồi vẽ lại; trả về hàm trả lại như cũ */
function suaViecMay(ma, sua) {
  const ds = viecMay(ma), cu = ds.map(v => JSON.stringify(v));
  ds.forEach(sua); veViecMay();
  return () => { ds.forEach((v, i) => { const o = JSON.parse(cu[i]); Object.keys(v).forEach(k => { delete v[k]; }); Object.assign(v, o); }); veViecMay(); };
}
const tangBan = (ma, n) => viecMay(ma).forEach(v => { v.ban = (v.ban || 0) + n; });
function datTT(ma, tt, ban) {                                   // đổi trạng thái ngay trên máy, tính các ô phụ thuộc giống máy xử lý
  const hn = homNay();
  return suaViecMay(ma, o => {
    const cu = o.tt;
    o.tt = tt; o.xong = tt === 'Xong' ? (o.xong || hn) : ''; o.ban = ban + 1;
    o.tre = tt !== 'Xong' && tt !== 'Tạm dừng' && !!o.han && o.han < hn;
    o.dung_han = tt === 'Xong' && o.han && o.xong ? o.xong <= o.han : null;
    if (o.lich_su) o.lich_su.unshift({ luc: gioMay(), nguoi: ME.ten, viec: tt === 'Xong' ? 'xong việc' : 'đổi trạng thái', chi_tiet: o.ten + ': ' + cu + ' → ' + tt });
  });
}
/* lấy bản mới của trang đang mở vào chỗ lưu sẵn (chưa vẽ) */
function taiTrang() { const [duong, tham] = (location.hash || '#/').split('?'); return chayMoi(duong, tham); }
/* vẽ lại trang đang mở từ số liệu vừa lấy về, giữ chữ đang gõ và vị trí cuộn */
async function veLai() {
  const [duong, tham] = (location.hash || '#/').split('?'), nd = $('#noidung'), q = new URLSearchParams(tham || ''), luot = LUOT;
  q.delete('mo');
  const g = chupO(nd), y = window.scrollY;
  NHANH = true;
  try { await (TRANG[duong] || TRANG['#/'])(nd, q); hienAiThay(duong); } catch (e) {} finally { NHANH = false; }
  if (luot !== LUOT) return void dinhTuyen(false);              // vừa chuyển trang giữa chừng: vẽ lại đúng trang đang mở
  traO(nd, g); window.scrollTo(0, y);
}
const dangBan = () => { const a = document.activeElement; return (KEO && Date.now() - KEO < 15000) || !!(a && (a.tagName === 'SELECT' || a.type === 'date') && ($('#noidung').contains(a) || $('#hopND').contains(a))); };
/* đối chiếu sau khi lưu xong; đang kéo thẻ hoặc đang mở ô chọn thì đợi một chút */
function doiChieu(dot, luot, ma, v, lan) {
  if (dot !== NEN.dot || NEN.cho) return;                         // đã có thao tác mới hơn: lượt đó sẽ đối chiếu
  if (dangBan() && (lan || 0) < 25) return void setTimeout(() => doiChieu(dot, luot, ma, v, (lan || 0) + 1), 400);
  if (v && HOP_VIEC && HOPV && HOPV.ma === ma) { HOPV = v; veHopGiu(); }

    const loi = NEN.loi, hs = NEN.hoan.splice(0); NEN.loi = null;

/* ---------- mốc giai đoạn ---------- */
function lopMoc(moc) {   // x = xong, d = mốc hiện tại (ngay sau mốc xa nhất đã xong), t = trễ hạn, q = nằm trước mốc đã xong nhưng chưa có căn cứ
  const hn = homNay(); let cuoi = -1; moc.forEach((m, i) => { if (m.xong) cuoi = i; });
  return moc.map((m, i) => { if (m.xong) return 'x'; if (i < cuoi) return 'q'; const tre = m.han && m.han < hn; return tre ? 't' : i === cuoi + 1 ? 'd' : ''; });
}
const mocThanh = moc => { const l = lopMoc(moc); return `<div class="moc" role="img" aria-label="${l.filter(c => c === 'x').length}/${moc.length} mốc đã xong">${moc.map((m, i) => `<i class="${l[i]}" title="${esc(m.moc)}"></i>`).join('')}</div>`; };
function duBaoChu(db) {
  if (!db) return '';
  const thieu = db.bo_qua ? ` · <span class="tag t-xam">${db.bo_qua} mốc trước chưa có căn cứ</span>` : '';
  if (!db.hien_tai) return `Đã xong mốc cuối (${db.xong}/${db.tong} mốc)${db.du_bao ? ' · ngày ' + ngay(db.du_bao) : ''}${thieu}`;
  let s = `${db.xong}/${db.tong} mốc · đang ở <b>${esc(db.hien_tai)}</b>${thieu}`;
  if (db.du_bao) s += ` · dự báo xong <b>${ngay(db.du_bao)}</b>${db.lech > 0 ? ` <span class="tag t-huy">trễ ${db.lech} ngày so với hạn</span>` : db.lech != null ? ' <span class="tag t-xong">kịp hạn</span>' : ''}`;
  else s += db.tam ? ' · đang tính lại dự báo…' : ' · chưa đủ dữ liệu để dự báo (cần hạn mốc cuối, hoặc từ 2 mốc có ngày xong)';
  return s;
}
/* 0.7.4: công ty đứng dấu hồ sơ (theo dấu từng bộ mốc, dấu cả công trình) – người được phân công thấy để làm hồ sơ */

    <div class="luoi" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px 14px;margin:0">${o('Mã số thuế', c.mst)}${o('Địa chỉ', c.dia_chi)}${o('Người đại diện', [c.dai_dien, c.chuc_vu].filter(Boolean).join(' – '))}${o('Người liên hệ', c.lien_he)}${o('Điện thoại', c.dien_thoai)}${o('Email', c.email)}</div></div>`).join('')}
    <p class="nho" style="margin:8px 0 0">Thông tin lấy ở trang Đối tác, dùng để làm hồ sơ. Thiếu hoặc sai thì báo anh Khuê sửa.</p></div>`;
}
function theMoc(x) {

        ${conLai.length ? `<div class="hang" style="margin-top:8px">${chon('mocDoi' + bi, conLai)}<button class="nut phu" style="flex:none" onclick="doiBo('${x.ma}',${bi})">Đổi sang bộ này</button></div>` : ''}

      ${adm && b.khac_mau ? `<p class="nho" style="margin:8px 0;color:var(--cam)">Bộ mốc này khác mẫu hiện tại. <button class="nut phu" style="padding:3px 9px" onclick="capNhatTheoMau('${x.ma}',${bi})">Cập nhật theo mẫu</button></p>` : ''}${adm && b.het_mau ? '<p class="nho" style="margin:8px 0">Bộ mẫu này đã bị xóa, công trình giữ mốc của mình.</p>' : ''}
      ${mocThanh(b.moc)}<div class="nho" style="margin-bottom:8px">${duBaoChu(b.du_bao)}</div>
      ${b.moc.map((m, i) => `<div class="dong"${x.sua_moc ? ` onclick="moMoc('${x.ma}',${bi},${m.thu_tu})"` : ' style="cursor:default"'}><div style="display:flex;gap:10px;align-items:center;min-width:0"><span class="sott ${l[i]}">${m.xong ? '✓' : m.thu_tu}</span><div class="chinh"><b>${esc(m.moc)}</b>${m.ghi_chu ? `<div class="nho">${esc(m.ghi_chu)}</div>` : ''}</div></div>
      <span style="display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end">${m.xong ? (/^Suy ra/.test(m.ghi_chu) ? '<span class="tag t-xam">đã qua (suy ra)</span>' : `<span class="tag t-xong">xong ${ngayNgan(m.xong)}</span>`) : ''}${m.han ? `<span class="tag ${!m.xong && l[i] === 't' ? 't-huy' : 't-xam'}">hạn ${ngayNgan(m.han)}</span>` : (m.xong ? '' : l[i] === 'q' ? '<span class="nho">chưa có căn cứ</span>' : '<span class="nho">chưa có hạn</span>')}</span></div>`).join('')}</div>`;
  }).join('') + them + `<p class="nho" style="margin:8px 0 0">${x.sua_moc ? 'Bấm vào một mốc để ghi ngày xong' + (adm ? ', đặt hạn.' : '.') : ''}${bos[0].du_bao && bos[0].du_bao.cach ? ' Dự báo: ' + esc(bos[0].du_bao.cach) : ''}</p></div>`;

function ganMoc(ma) {

  ghiRoiTai('ganMoc', { ma, loai, dau }, '', 'Đã gắn bộ mốc ' + loai + (dau ? ' (dấu ' + dau + ')' : '')).catch(() => {});

function doiBo(ma, bi) {

function suaDauBo(ma, bi) {

function moMoc(ma, bi, tt) {

    <p style="margin:14px 0 0;display:flex;gap:8px;flex-wrap:wrap">${m.xong ? '' : `<button class="nut vang" onclick="$('#mmXong').value=homNay();luuMoc('${ma}',${bi},${tt})">Xong hôm nay</button>`}<button class="nut" onclick="luuMoc('${ma}',${bi},${tt})">Lưu</button><button class="nut phu" onclick="dongHop()">Thôi</button></p>
    <p class="nho" style="margin:10px 0 0">Bỏ trống “Ngày xong” để mở lại mốc.</p>`);

function luuMoc(ma, bi, tt) {
  const x = CACHE.ctDang, b = x && x.ma === ma ? x.bo_moc[bi] : null;

function luuMQ() { const ten = $('#mqTen').value.trim(); if (!ten) return bao('Nhập tên mẫu'); ghiRoiTai('luuMauQT', { ten, nhom: $('#mqNhom').value.trim() || 'Khác', link: $('#mqLink').value.trim(), ghi_chu: $('#mqGC').value }, '', 'Đã thêm mẫu').catch(() => {}); }
function boMQ(ma) { if (confirm('Bỏ mẫu này khỏi danh sách?')) ghiRoiTai('luuMauQT', { ma, bo: true }, '', 'Đã bỏ').catch(() => {}); }
function luuMauMoc(i) {
  const l = Object.keys(CACHE.mau.moc)[i], ten = ($('#mmN' + i) ? $('#mmN' + i).value : l).replace(/\s+/g, ' ').trim(), ds = $('#mmT' + i).value.split('\n').map(s => s.trim()).filter(Boolean);

}
/* 0.7.5: báo kết quả cập nhật công trình theo bộ mẫu */
function baoApMau(r, dau) {
  r = r || {}; const cn = r.cap_nhat || [], giu = r.giu || [];
  const t = [dau + (r.doi_ct ? `, đổi tên bộ ở ${r.doi_ct} công trình` : '')];
  t.push(cn.length ? `cập nhật ${cn.length} công trình` : 'không công trình nào phải cập nhật');
  if (giu.length) t.push('giữ mốc cũ ở ' + giu.map(g => g.ma.slice(-3) + ' (mốc “' + g.moc.join('”, “') + '” đã có dữ liệu)').join('; '));
  bao(t.join('; '), giu.length ? 12000 : 5000);
}
function apMauMoc(i) {
  const l = Object.keys(CACHE.mau.moc)[i];
  ghiRoiTai('apMauMoc', { loai: l }, '', null).then(r => baoApMau(r, 'Xong')).catch(() => {});
}
function capNhatTheoMau(ma, bi, ep) {
  const b = CACHE.ctDang.bo_moc[bi]; if (!b) return;
  if (!ep && !confirm('Cập nhật bộ “' + b.loai + '” của công trình này theo mẫu hiện tại? Ngày xong, hạn, ghi chú của mốc trùng hoặc gần trùng tên được giữ.')) return;
  ghiRoiTai('apMauMoc', { loai: b.loai, ma, ep: !!ep }, '', null).then(r => {
    const g = (r && r.giu || [])[0];
    if (g && !ep) {
      if (confirm('Mốc “' + g.moc.join('”, “') + '” đã có ngày xong, hạn hoặc ghi chú nhưng không còn trong mẫu. Bỏ mốc này khỏi công trình (vẫn lưu trong bảng dữ liệu) để cập nhật theo mẫu?')) capNhatTheoMau(ma, bi, true);
      return;
    }
    bao(r && (r.cap_nhat || []).length ? 'Đã cập nhật theo mẫu' : 'Bộ mốc đã đúng mẫu', 4000);
  }).catch(() => {});
}
function xoaMauMoc(i) {
  const l = Object.keys(CACHE.mau.moc)[i], n = (CACHE.mau.dung || {})[l] || 0;
  if (confirm(`Xóa bộ mốc "${l}"?` + (n ? ` ${n} công trình đang dùng vẫn giữ nguyên mốc của mình.` : ''))) ghiRoiTai('luuMauMoc', { loai: l, xoa: true }, '', 'Đã xóa bộ mốc').catch(() => {});
}
function themMauMoc() {
  const ten = $('#mmMoiTen').value.replace(/\s+/g, ' ').trim(), ds = $('#mmMoiDS').value.split('\n').map(s => s.trim()).filter(Boolean);
  if (!ten) return bao('Nhập tên bộ mốc'); if (!ds.length) return bao('Cần ít nhất 1 mốc');
  ghiRoiTai('luuMauMoc', { loai: '', ten, ds }, '', 'Đã thêm bộ mốc').catch(() => {});
}

    `<div class="kn m${k.muc}"><h3>${esc(k.tieu_de)}</h3>${k.ly_do.length ? `<ul>${k.ly_do.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div>7 ngày qua chưa chạm ngưỡng nào dưới đây.</div>'}${k.viec.length ? `<div style="margin-top:8px"><b>Việc nên làm</b><ul>${k.viec.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}${k.ghi_chu ? `<div class="nho" style="margin-top:8px">${esc(k.ghi_chu)}</div>` : ''}</div>
    <div class="luoi"><div class="kpi"><div class="nhan">Người dùng chờ trung bình</div><div class="so">${giay(s.tb)}</div><div class="them">7 ngày · ${s.kh_n} lượt đo · ngưỡng 3 s</div></div>
      <div class="kpi ${s.pt_cham > 20 ? 'do' : 'xanh'}"><div class="nhan">Lượt chậm hơn 3 giây</div><div class="so">${s.pt_cham == null ? '—' : s.pt_cham + '%'}</div><div class="them">${s.ngay_cham} ngày chậm trong 7 ngày · ngưỡng 3 ngày</div></div>
      <div class="kpi toi"><div class="nhan">Nhiều người nhất trong 1 giờ</div><div class="so">${s.nguoi_max}</div><div class="them">ngưỡng nâng cấp 15 người</div></div>
      <div class="kpi ${s.loi || s.han_muc ? 'do' : 'xanh'}"><div class="nhan">Lỗi hệ thống 7 ngày</div><div class="so">${s.loi}</div><div class="them">${s.han_muc} lỗi hạn mức · ${s.ban} lần chờ khóa</div></div></div>
    <div class="the"><h3>Theo ngày</h3><div class="cuon"><table class="bang co-the"><thead><tr><th>Ngày</th><th class="r">Lượt gọi</th><th class="r">Người (giờ đông nhất)</th><th class="r">Máy xử lý TB</th><th class="r">Người dùng chờ TB</th><th class="r">Chờ lâu nhất</th><th class="r">Lượt trên 3 s</th><th class="r">Từ bộ nhớ đệm</th><th class="r">Lỗi</th></tr></thead><tbody>
      ${d.ngay.slice().reverse().map(n => `<tr><td data-n="Ngày">${ngay(n.ngay)}</td><td class="r" data-n="Lượt gọi">${n.luot}</td><td class="r" data-n="Người">${esc(n.nguoi)}</td><td class="r" data-n="Máy xử lý TB">${n.may_tb == null ? '—' : n.may_tb + ' ms'}</td><td class="r" data-n="Người dùng chờ TB">${n.kh_tb == null ? '—' : `<b${n.kh_tb > 3000 ? ' style="color:#b42318"' : ''}>${giay(n.kh_tb)}</b>`}</td><td class="r" data-n="Chờ lâu nhất">${n.kh_n ? giay(n.kh_max) : '—'}</td><td class="r" data-n="Lượt trên 3 s">${n.cham}${n.kh_n ? ' / ' + n.kh_n : ''}</td><td class="r" data-n="Từ bộ nhớ đệm">${n.luot ? Math.round(100 * n.dem / n.luot) + '%' : '—'}</td><td class="r" data-n="Lỗi">${n.loi ? `<b style="color:#b42318" title="${esc(n.loi_gan)}">${n.loi}</b>` : '0'}</td></tr>`).join('') || '<tr><td colspan="9" class="rong">Chưa có số đo. Số đo ghi xuống bảng mỗi 30 phút.</td></tr>'}</tbody></table></div>
      ${d.ngay.some(n => n.loi_gan) ? `<p class="nho" style="margin:10px 0 0">Lỗi gần nhất: ${esc(d.ngay.filter(n => n.loi_gan).pop().loi_gan)}</p>` : ''}</div>
    <div class="hai"><div class="the"><h3>Thao tác nặng nhất</h3><table class="bang"><thead><tr><th>Thao tác</th><th class="r">Lượt</th><th class="r">TB</th><th class="r">Lâu nhất</th></tr></thead><tbody>${d.api.map(a => `<tr><td>${esc(a.ten)}</td><td class="r">${a.luot}</td><td class="r">${a.tb} ms</td><td class="r">${a.max} ms</td></tr>`).join('') || '<tr><td colspan="4" class="rong">Chưa có số đo</td></tr>'}</tbody></table><p class="nho" style="margin:8px 0 0">Thời gian máy xử lý, chưa gồm đường truyền.</p></div>
      <div><div class="the"><h3>Kích thước dữ liệu</h3>${d.bang.slice().sort((a, b) => b.dong - a.dong).slice(0, 10).map(b => `<div class="dong" style="cursor:default"><span>${esc(b.ten)}</span><b${b.dong > 5000 ? ' style="color:#b42318"' : ''}>${b.dong.toLocaleString('vi-VN')} dòng</b></div>`).join('')}${d.excel ? `<p class="nho" style="margin:8px 0 0">Sổ Excel đọc lúc ${esc(d.excel.luc)}: ${d.excel.thu} dòng thu, ${d.excel.chi} dòng chi, ${d.excel.ct} công trình, ${d.excel.vp} khoản văn phòng.</p>` : ''}</div>
      <div class="the"><h3>Tự kiểm</h3><div class="dong" style="cursor:default"><span>Khóa chống ghi đè</span><b>${esc(d.tu_kiem.khoa)}</b></div><div class="dong" style="cursor:default"><span>Bộ nhớ đệm</span><b>${esc(d.tu_kiem.dem)}</b></div><div class="dong" style="cursor:default"><span>Phiên bản máy xử lý</span><b>${esc(d.tu_kiem.phien_ban)}</b></div></div></div></div>
    <div class="the"><h3>Ai đã xem mục tài chính (14 ngày gần nhất)</h3><p class="nho" style="margin-top:-6px">Ghi theo giờ. Lượt đăng nhập bị từ chối hôm nay: <b>${esc(d.tu_choi || 0)}</b>.</p><table class="bang"><thead><tr><th>Giờ</th><th>Người</th><th>Mục</th><th class="r">Lượt</th></tr></thead><tbody>${(d.xem || []).map(x => `<tr><td data-n="Giờ">${esc(String(x.gio).slice(8, 10) + '/' + String(x.gio).slice(5, 7) + ' ' + String(x.gio).slice(11, 16))}</td><td data-n="Người">${esc(x.email)}</td><td data-n="Mục">${esc(({ thuChi: 'Thu chi', congNo: 'Công nợ', bangLuong: 'Bảng lương', heSo: 'Hệ số', vanPhong: 'Văn phòng' })[x.muc] || x.muc)}</td><td class="r" data-n="Lượt">${esc(x.n)}</td></tr>`).join('') || '<tr><td colspan="4" class="rong">Chưa có lượt xem nào được ghi</td></tr>'}</tbody></table></div>
    <div class="the nho"><b>Ngưỡng kiến nghị</b> (ghi trong tài liệu Lộ trình, Đợt 9). Nên nâng lên database khi có một trong các dấu hiệu: từ 3 ngày trong 7 ngày người dùng chờ trung bình trên 3 giây; từ 15 người dùng trong cùng 1 giờ; từ 3 lỗi hạn mức của Google; từ 10 lần phải chờ vì nhiều người lưu cùng lúc. Chạm một nửa các ngưỡng này thì app báo “Theo dõi sát”.</div>`;
  $('#htLamMoi').onclick = async () => { await ghi('lamMoi', {}, 'Đã làm mới. Số liệu các trang sẽ đọc lại từ bảng.'); };
};

/* ---------- Cài đặt ---------- */
TRANG['#/cai-dat'] = async nd => {
  nd.innerHTML = tieuDe('Cài đặt') + `<div class="the"><h3>Số liệu Excel</h3><p class="nho" style="margin-top:-6px">App tự đọc lại 30 phút/lần khi file Excel thay đổi. Bấm để đọc ngay.</p><button class="nut" id="nutDB">Đọc lại Excel ngay</button></div>
  <div class="the"><h3>Cài app lên máy</h3><p class="nho" style="margin:0">Điện thoại: mở trang này bằng Chrome (Android) hoặc Safari (iPhone) → menu → <b>Thêm vào màn hình chính</b>. Máy tính: Chrome → biểu tượng cài đặt trên thanh địa chỉ.</p></div>
  <div class="the"><h3>Tài khoản</h3><p class="nho" style="margin-top:-6px">Đăng xuất sẽ xóa số liệu đang lưu sẵn trên máy này. Dùng khi cho mượn máy hoặc đổi máy.</p><button class="nut phu" id="nutDX2">Đăng xuất</button></div>
  <div class="the"><h3>Tình trạng hệ thống</h3><p class="nho" style="margin-top:-6px">Thời gian tải, số người dùng, lỗi và kiến nghị nâng cấp.</p><a class="nut phu" href="#/he-thong" style="text-decoration:none">Mở trang Hệ thống</a></div>
  <div class="the nho">Giao diện phiên bản 0.7.6 · máy xử lý phiên bản ${esc(ME.phien_ban || '?')}</div>`;
  $('#nutDX2').onclick = dangXuat;
  $('#nutDB').onclick = async () => { $('#nutDB').disabled = true; bao('Đang đọc…', 60000); try { bao(await goi('dongBoNgay')); } finally { $('#nutDB').disabled = false; } };
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
khoiDong();
</script>
